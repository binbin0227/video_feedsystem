global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/backend-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

storage:
  tsdb:
    retention:
      time: 7d
      size: 1GB

scrape_configs:
  - job_name: video-feed-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8080
